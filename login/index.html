<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Wedding Story</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-parchment: #f4eee1;
      --text-espresso: #2b1e1a;
      --gold: #c5a059;
      --burgundy: #6b1d2f;
    }
    body {
      background-color: #0c0a09;
      color: var(--text-espresso);
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
    }
    .card {
      background: var(--bg-parchment);
      border: 2px solid var(--gold);
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      box-sizing: border-box;
    }
    h2 {
      font-family: 'Cinzel', serif;
      color: var(--burgundy);
      margin-bottom: 15px;
    }
    label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0 10px 0;
      border: 1px solid var(--gold);
      background: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      font-family: inherit;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #fff;
      border: none;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 15px;
    }
    button:hover {
      background: var(--burgundy);
    }
    .error {
      color: var(--burgundy);
      margin-top: 10px;
      display: none;
    }
    #dashboard {
      display: none;
    }
    .code-box {
      background: #2b1e1a;
      color: #f4eee1;
      padding: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
      border-radius: 4px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN FORM -->
  <div class="card" id="loginCard">
    <h2>Admin Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">ENTER DASHBOARD</button>
    <p class="error" id="errorMsg">Invalid credentials!</p>
  </div>

  <!-- 2. PROTECTED ADMIN DASHBOARD -->
  <div class="card" id="dashboard">
    <h2>Wedding Content Editor</h2>
    <p style="font-size: 0.9rem;">Fill in your details below, click <b>Generate Config Code</b>, and paste it into <code>config.js</code> on GitHub.</p>
    <hr style="border-color: var(--gold); margin: 15px 0;">
    
    <label>Bride Name</label>
    <input type="text" id="brideName" value="Evelyn Sterling">
    
    <label>Groom Name</label>
    <input type="text" id="groomName" value="Arthur Montgomery">
    
    <label>Wedding Date</label>
    <input type="text" id="date" value="October 24, 2026">
    
    <label>Venue Name</label>
    <input type="text" id="venue" value="The St. Regis Grand Ballroom">
    
    <label>Location</label>
    <input type="text" id="location" value="London, United Kingdom">

    <label>First Date Story</label>
    <textarea id="story" rows="3">Under the golden canopy of Kensington Gardens...</textarea>

    <button onclick="generateConfig()">GENERATE CONFIG CODE</button>

    <div id="outputArea" style="display:none; margin-top:20px;">
      <p style="font-size:0.85rem; text-align:left; font-weight:bold;">Copy this code & paste into <u>config.js</u> on GitHub:</p>
      <div class="code-box" id="codeOutput"></div>
    </div>

    <button onclick="logout()" style="background: var(--burgundy); margin-top: 20px;">LOGOUT</button>
  </div>

  <script>
    const AUTH_USER = "shogun";
    const AUTH_PASS = "182002";

    if (sessionStorage.getItem("isLoggedIn") === "true") {
      showDashboard();
    }

    function login() {
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;

      if (u === AUTH_USER && p === AUTH_PASS) {
        sessionStorage.setItem("isLoggedIn", "true");
        showDashboard();
      } else {
        document.getElementById("errorMsg").style.display = "block";
      }
    }

    function showDashboard() {
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    }

    function generateConfig() {
      const configText = `const WEDDING_DATA = {\n` +
        `  brideName: "${document.getElementById('brideName').value}",\n` +
        `  groomName: "${document.getElementById('groomName').value}",\n` +
        `  date: "${document.getElementById('date').value}",\n` +
        `  venue: "${document.getElementById('venue').value}",\n` +
        `  location: "${document.getElementById('location').value}",\n` +
        `  firstDateStory: "${document.getElementById('story').value.replace(/"/g, '\\"')}"\n` +
        `};`;
      
      document.getElementById("codeOutput").innerText = configText;
      document.getElementById("outputArea").style.display = "block";
    }

    function logout() {
      sessionStorage.removeItem("isLoggedIn");
      window.location.reload();
    }
  </script>
</body>
</html>
