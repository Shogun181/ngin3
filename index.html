<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-parchment: #f4eee1;
      --text-espresso: #2b1e1a;
      --gold: #c5a059;
      --burgundy: #6b1d2f;
    }
    body {
      background-color: #0c0a09;
      color: var(--text-espresso);
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: var(--bg-parchment);
      border: 2px solid var(--gold);
      padding: 40px 20px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      font-family: 'Cinzel', serif;
      color: var(--burgundy);
      font-size: 2.2rem;
      margin-bottom: 5px;
    }
    .amp {
      color: var(--gold);
      font-size: 1.8rem;
      margin: 10px 0;
    }
    .details-box {
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      padding: 15px 0;
      margin: 25px 0;
    }
    .detail-item {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 8px 0;
    }
    .story-section {
      text-align: justify;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-top: 20px;
      padding: 0 10px;
    }
    .story-title {
      font-family: 'Cinzel', serif;
      color: var(--burgundy);
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="brideName"></h1>
    <div class="amp">&amp;</div>
    <h1 id="groomName"></h1>

    <div class="details-box">
      <div class="detail-item" id="weddingDate"></div>
      <div class="detail-item" id="weddingTime"></div>
      <div class="detail-item" id="weddingVenue"></div>
      <div class="detail-item" id="weddingLocation"></div>
    </div>

    <div class="story-section">
      <div class="story-title">Our Story</div>
      <p id="firstDateStory"></p>
    </div>
  </div>

  <script>
    // Load variables from config.js automatically
    document.getElementById("brideName").textContent = WEDDING_DATA.brideName;
    document.getElementById("groomName").textContent = WEDDING_DATA.groomName;
    document.getElementById("weddingDate").textContent = "Date: " + WEDDING_DATA.date;
    document.getElementById("weddingTime").textContent = "Time: " + WEDDING_DATA.time;
    document.getElementById("weddingVenue").textContent = "Venue: " + WEDDING_DATA.venue;
    document.getElementById("weddingLocation").textContent = "Location: " + WEDDING_DATA.location;
    document.getElementById("firstDateStory").textContent = WEDDING_DATA.firstDateStory;
  </script>

</body>
</html>
